services:
  postgres:
    image: postgres:16-alpine
    container_name: papelaria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papelaria
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papelaria"]
      interval: 5s
      timeout: 5s
      retries: 5
    shm_size: 128mb

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: papelaria-api
    restart: unless-stopped
    init: true
    # esse comando garante a migração antes da api iniciar
    command: sh -c "npm run migrate && node server.js"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/papelaria
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/papelaria
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
